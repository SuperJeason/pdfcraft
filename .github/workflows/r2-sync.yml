name: Sync LibreOffice WASM Assets To R2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/libreoffice-wasm/**"
      - "scripts/decompress-wasm.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/r2-sync.yml"

jobs:
  sync-r2:
    runs-on: ubuntu-latest
    concurrency:
      group: r2-sync-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Validate required secrets
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID"
          test -n "$R2_BUCKET"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"

      - name: Install dependencies
        run: npm ci

      - name: Build static output
        run: npm run build

      - name: Decompress LibreOffice WASM assets for export output
        run: node scripts/decompress-wasm.mjs

      - name: Install AWS CLI
        run: |
          python -m pip install --upgrade pip
          pip install awscli

      - name: Sync assets to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          R2_ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3 sync out/libreoffice-wasm "s3://${R2_BUCKET}/libreoffice-wasm" \
            --endpoint-url "${R2_ENDPOINT}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"
